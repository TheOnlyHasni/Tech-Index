<script>
  // Standardized theme initialization to prevent Flash of Unstyled Content (FOUC)
  (function () {
    const savedTheme = localStorage.getItem("pref-theme") || "system";
    const html = document.documentElement;

    const applyInitialTheme = (theme) => {
      let isDark = theme === "dark";
      if (theme === "system") {
        isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      if (isDark) {
        html.classList.add("dark");
        html.setAttribute("data-theme", "dark");
      } else {
        html.classList.remove("dark");
        html.setAttribute("data-theme", "light");
      }
    };

    // Apply immediately to prevent flash
    applyInitialTheme(savedTheme);

    // Add preload class to suppress transitions during initial paint
    html.classList.add("preload");
    window.addEventListener("DOMContentLoaded", function () {
      // Small timeout ensures the browser has rendered the initial state before enabling transitions
      setTimeout(function () {
        html.classList.remove("preload");
      }, 50);
    });
  })();
</script>
