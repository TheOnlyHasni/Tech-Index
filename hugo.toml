baseURL = 'https://value1.shop/'
languageCode = 'en-us'
title = 'Tech Index'
theme = 'PaperMod'
canonifyURLs = true

[pagination]
pagerSize = 6

[outputs]
home = ["HTML", "RSS", "SEARCHJSON"]
page = ["HTML", "PlainText", "RawMarkdown", "PrintHTML"]

[outputFormats]
[outputFormats.SEARCHJSON]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternative = true

[outputFormats.PlainText]
mediaType = "text/plain"
baseName = "index"
isPlainText = true
notAlternative = false
path = ""
permalinkable = false

[outputFormats.RawMarkdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
notAlternative = false
path = ""
permalinkable = false

[outputFormats.PrintHTML]
mediaType = "text/html"
baseName = "index"
isPlainText = false
notAlternative = true
path = "print"
permalinkable = true
suffix = "html"

[taxonomies]
category = 'categories'
tag = 'tags'

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    noClasses = true


[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 15
[[menu.main]]
name = "Tutorials"
url = "/tutorials/"
weight = 20
[[menu.main]]
name = "Solutions"
url = "/errors/"
weight = 22
[[menu.main]]
name = "Topics"
url = "/categories/"
weight = 25
[[menu.main]]
name = "About Us"
url = "/about/"
weight = 30
[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 40
[[menu.main]]
name = "Search"
url = "/search/"
weight = 50

[params]
description = "High-utility tech tutorials and SaaS guides designed to help you master modern software development and digital tools."
author = "Tech Index"
defaultTheme = "auto"
env = "production"
mainSections = ["posts", "tutorials", "errors"]

# AdSense/SEO Features
ShowReadingTime = true
ShowShareButtons = true
ShowCodeCopyButtons = true
ShowBreadCrumbs = true
ShowPostNavLinks = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 100
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

# Home-Info Mode
[params.homeInfoParams]
Title = "Tech Index"
Content = "**Practical tutorials and error solutions for developers and tech users.**\n\nWhen technology breaks or confuses you, we have the fix. Browse step-by-step guides, documented error solutions, and technical insights that actually work.\n\n**What you'll find here:**\n- Tested tutorials for web development, deployment, and system optimization\n- Documented error messages with verified solutions\n- Technical guides for modern tools and frameworks\n- Analysis of emerging tech trends and tools\n\nAll content is tested across multiple platforms before publication."


# Social Proof
[[params.socialIcons]]
name = "x"
url = "https://x.com/@I_am_Hasnii"
[[params.socialIcons]]
name = "github"
url = "https://github.com/TheOnlyHasni"
[[params.socialIcons]]
name = "facebook"
url = "https://facebook.com/61556325603943"
[[params.socialIcons]]
name = "instagram"
url = "https://instagram.com/@i.am.hasni"

# Footer Cleanliness
hideFooter = false # We want the footer, but we will override the content
ShowFullTextinRSS = false

[params.assets]
disableHLJS = false
favicon = "svgs/favicon.svg"
favicon16x16 = "svgs/favicon.svg"
favicon32x32 = "svgs/favicon.svg"
apple_touch_icon = "svgs/favicon.svg"
safari_pinned_tab = "svgs/favicon.svg"

[params.label]
text = "Tech Index"
icon = "svgs/favicon.svg"
iconHeight = 35

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"
